<head>

    <script src="js/supabase.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #f0f4fa 0%, #e2e9f3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-wrapper {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #1e3c72, #153155);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }

        .logo-wrapper i {
            font-size: 2.2rem;
            color: white;
        }

        .login-header h1 {
            color: #0b1f35;
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
            font-weight: 700;
        }

        .login-header p {
            color: #4e6580;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #1e3a5f;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .input-field {
            position: relative;
        }

        .input-field i:not(.toggle-password) {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6a7f9e;
            font-size: 1.1rem;
            z-index: 1;
        }

        .input-field .toggle-password {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6a7f9e;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 2;
            transition: color 0.2s;
        }

        .input-field .toggle-password:hover {
            color: #1e3c72;
        }

        .input-field input {
            width: 100%;
            padding: 1rem 2.5rem 1rem 2.8rem;
            border: 1.5px solid #d7e0ea;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: white;
        }

        .input-field input:focus {
            outline: none;
            border-color: #1e3c72;
            box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #1e3c72, #153155);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        .message.error {
            display: block;
            background: #fff2f5;
            color: #e34f76;
            border: 1px solid #fecaca;
        }

        .message.success {
            display: block;
            background: #eef9f0;
            color: #2e9b54;
            border: 1px solid #b8e0c0;
        }

        .message.info {
            display: block;
            background: #e8f0fe;
            color: #1e3c72;
            border: 1px solid #b8d4f0;
        }

        .message.warning {
            display: block;
            background: #fff4e5;
            color: #d97706;
            border: 1px solid #fde68a;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: #4e6580;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: #1e3c72;
        }

        .input-hint {
            font-size: 0.75rem;
            color: #6a7f9e;
            margin-top: 0.25rem;
            text-align: right;
        }

        /* رسالة الحساب المعطل */
        .account-locked {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background: #fff2f5;
            border-radius: 12px;
            border-right: 4px solid #e34f76;
            display: none;
        }
        .account-locked.show {
            display: block;
        }
        .account-locked p {
            color: #e34f76;
            font-size: 0.85rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .account-locked i {
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-wrapper">
                    <i class="fas fa-chalkboard-teacher"></i>
                </div>
                <h1>نظام التقارير التربوية الموحد</h1>
                <p>تسجيل الدخول إلى حسابك</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label class="input-label">
                        <i class="fas fa-user" style="margin-left: 0.5rem;"></i>
                       اسم المستخدم أو البريد الإلكتروني
                    </label>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" id="usernameOrEmail" placeholder="أدخل اسم المستخدم أو البريد الإلكتروني" required autocomplete="username">
                    </div>
                    <div class="input-hint">يمكنك استخدام اسم المستخدم أو البريد الإلكتروني (غير حساس لحالة الأحرف)</div>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        <i class="fas fa-lock" style="margin-left: 0.5rem;"></i>
                        كلمة المرور
                    </label>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
                        <i class="fas fa-eye toggle-password" id="toggleIcon" onclick="togglePassword()"></i>
                    </div>
                    <div class="input-hint">كلمة المرور حساسة لحالة الأحرف</div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    تسجيل الدخول
                </button>

                <div id="message" class="message"></div>
                <div id="accountLockedMessage" class="account-locked">
                    <p><i class="fas fa-lock"></i> هذا الحساب معطل. يرجى التواصل مع المدير لتفعيله.</p>
                </div>
            </form>

            <div class="back-link">
                <a href="index.html">
                    <i class="fas fa-arrow-right"></i>
                    العودة للصفحة الرئيسية
                </a>
            </div>
        </div>
    </div>

    <script>
// التحقق من تحميل supabase
console.log('Supabase library loaded:', typeof window.supabase !== 'undefined' ? 'Yes' : 'No');
console.log('Supabase client exists:', typeof window.supabaseClient !== 'undefined' ? 'Yes' : 'No');

// دالة إظهار/إخفاء كلمة المرور
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
    } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
    }
}

// دالة عرض الرسائل
function showMessage(text, type) {
    const messageDiv = document.getElementById('message');
    messageDiv.className = `message ${type}`;
    const icon = type === 'success' ? 'fa-check-circle' : (type === 'info' ? 'fa-info-circle' : (type === 'warning' ? 'fa-exclamation-triangle' : 'fa-exclamation-circle'));
    messageDiv.innerHTML = `<i class="fas ${icon}"></i> ${text}`;
    messageDiv.style.display = 'block';
    
    // إخفاء رسالة الحساب المعطل عند ظهور رسالة أخرى
    document.getElementById('accountLockedMessage').classList.remove('show');
    
    setTimeout(() => {
        messageDiv.style.display = 'none';
    }, 4000);
}

// عرض رسالة الحساب المعطل
function showAccountLocked() {
    document.getElementById('accountLockedMessage').classList.add('show');
    document.getElementById('message').style.display = 'none';
}

// دالة جلب بيانات المنطقة والمدرسة للمستخدم
async function fetchUserRelations(user) {
    try {
        const userData = {
            id: user.id,
            username: user.username,
            email: user.email,
            name: user.name || user.full_name || user.username,
            role: user.role,
            district_id: user.district_id,
            school_id: user.school_id,
            is_active: user.is_active !== false
        };
        
        // جلب اسم المنطقة إذا وجدت
        if (user.district_id) {
            const { data: district } = await window.supabaseClient
                .from('districts')
                .select('name')
                .eq('id', user.district_id)
                .maybeSingle();
            
            if (district) {
                userData.district_name = district.name;
                userData.district = district.name;
            }
        }
        
        // جلب اسم المدرسة إذا وجدت
        if (user.school_id) {
            const { data: school } = await window.supabaseClient
                .from('schools')
                .select('name')
                .eq('id', user.school_id)
                .maybeSingle();
            
            if (school) {
                userData.school_name = school.name;
                userData.school = school.name;
            }
        }
        
        return userData;
    } catch (error) {
        console.error('Error fetching user relations:', error);
        return {
            id: user.id,
            username: user.username,
            email: user.email,
            name: user.name || user.full_name || user.username,
            role: user.role,
            is_active: user.is_active !== false
        };
    }
}

// ===================== دالة تسجيل الدخول المحسنة =====================
async function handleLoginWithOrLogic(event) {
    event.preventDefault();
    
    const usernameOrEmailInput = document.getElementById('usernameOrEmail').value.trim();
    const password = document.getElementById('password').value;
    const loginBtn = document.getElementById('loginBtn');
    
    // إخفاء الرسائل السابقة
    document.getElementById('message').style.display = 'none';
    document.getElementById('accountLockedMessage').classList.remove('show');
    
    if (!usernameOrEmailInput || !password) {
        showMessage('الرجاء إدخال اسم المستخدم/البريد الإلكتروني وكلمة المرور', 'error');
        return;
    }
    
    if (typeof window.supabaseClient === 'undefined' || !window.supabaseClient) {
        showMessage('خطأ في تحميل قاعدة البيانات', 'error');
        console.error('Supabase client is not available');
        return;
    }
    
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري تسجيل الدخول...';
    
    try {
        console.log('🔍 البحث عن المستخدم:', usernameOrEmailInput);
        
        // استخدام OR logic للبحث في username و email
        const { data: users, error } = await window.supabaseClient
            .from('users')
            .select('*')
            .or(`username.ilike.%${usernameOrEmailInput}%,email.ilike.%${usernameOrEmailInput}%`);
        
        if (error) {
            console.error('Supabase query error:', error);
            throw new Error('حدث خطأ في الاتصال بقاعدة البيانات');
        }
        
        console.log('📊 نتائج البحث:', users?.length || 0, 'مستخدم');
        
        // البحث عن التطابق الدقيق
        let matchedUser = null;
        
        if (users && users.length > 0) {
            for (const user of users) {
                const usernameMatch = user.username && user.username.toLowerCase() === usernameOrEmailInput.toLowerCase();
                const emailMatch = user.email && user.email.toLowerCase() === usernameOrEmailInput.toLowerCase();
                
                if ((usernameMatch || emailMatch) && user.password === password) {
                    matchedUser = user;
                    break;
                }
            }
        }
        
        if (!matchedUser) {
            showMessage('اسم المستخدم/البريد الإلكتروني أو كلمة المرور غير صحيحة', 'error');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
            return;
        }
        
        // ===================== التحقق من حالة الحساب =====================
        const isActive = matchedUser.is_active !== false;
        
        console.log(`👤 المستخدم: ${matchedUser.name}, الحالة: ${isActive ? 'نشط' : 'معطل'}`);
        
        if (!isActive) {
            // الحساب معطل - منع تسجيل الدخول
            showAccountLocked();
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
            return;
        }
        
        // ===================== الحساب نشط - السماح بتسجيل الدخول =====================
        showMessage('جاري تحميل بيانات المستخدم...', 'info');
        
        const fullUserData = await fetchUserRelations(matchedUser);
        fullUserData.login_timestamp = new Date().toISOString();
        
        localStorage.setItem('currentUser', JSON.stringify(fullUserData));
        
        console.log('✅ تم تسجيل الدخول بنجاح:', fullUserData.name);
        
        showMessage(`مرحباً ${fullUserData.name}، تم تسجيل الدخول بنجاح`, 'success');
        
        setTimeout(() => {
            window.location.href = 'dashboard.html';
        }, 1500);
        
    } catch (error) {
        console.error('❌ Login error:', error);
        showMessage(error.message || 'حدث خطأ في تسجيل الدخول', 'error');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> تسجيل الدخول';
    }
}

// استخدام الدالة المحسنة
const loginHandler = handleLoginWithOrLogic;

// ربط حدث submit
document.getElementById('loginForm').addEventListener('submit', loginHandler);

// ===================== التحقق من حالة المستخدم عند تحميل الصفحة =====================
window.addEventListener('load', () => {
    const savedUser = localStorage.getItem('currentUser');
    if (savedUser) {
        try {
            const user = JSON.parse(savedUser);
            if (user && user.id) {
                // التحقق من حالة الحساب من قاعدة البيانات
                window.supabaseClient
                    .from('users')
                    .select('is_active')
                    .eq('id', user.id)
                    .single()
                    .then(({ data, error }) => {
                        if (error) {
                            console.warn('Could not verify account status:', error);
                            // في حالة خطأ، نوجه إلى لوحة التحكم
                            window.location.href = 'dashboard.html';
                            return;
                        }
                        // إذا كان الحساب معطل، نخرج المستخدم
                        if (data && data.is_active === false) {
                            console.log('⚠️ الحساب معطل، تسجيل الخروج...');
                            localStorage.removeItem('currentUser');
                            // عرض رسالة على الصفحة الحالية
                            showAccountLocked();
                        } else {
                            console.log('✅ الحساب نشط، توجيه إلى لوحة التحكم');
                            window.location.href = 'dashboard.html';
                        }
                    })
                    .catch(() => {
                        // في حالة خطأ، نوجه إلى لوحة التحكم
                        window.location.href = 'dashboard.html';
                    });
            }
        } catch (e) {
            console.error('Invalid saved user data');
            localStorage.removeItem('currentUser');
        }
    }
});

// دعم الضغط على Enter
document.getElementById('password').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }
});

document.getElementById('usernameOrEmail').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }
});

// إضافة تلميح بصري لنوع الإدخال
document.getElementById('usernameOrEmail').addEventListener('input', function(e) {
    const input = e.target;
    if (input.value.includes('@')) {
        input.setAttribute('data-type', 'email');
    } else {
        input.setAttribute('data-type', 'username');
    }
});

console.log('✅ login.html loaded with account status verification (is_active)');
</script>
</body>
</html>
